<svg xmlns="http://www.w3.org/2000/svg" viewBox="260 110 1080 608" width="1080" height="608" role="img" aria-labelledby="t">
  <title id="t">Illustration of an upcoming co-branded credit card. The official card design has not been published.</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#2a2622"/>
      <stop offset="0.55" stop-color="#161513"/>
      <stop offset="1" stop-color="#0c0c0b"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1f1a"/>
      <stop offset="0.5" stop-color="#1d1311"/>
      <stop offset="1" stop-color="#0f0a09"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9cf9a"/>
      <stop offset="1" stop-color="#b8904f"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="440" y="190" width="720" height="454" rx="34"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="260" y="110" width="1080" height="608" fill="url(#bg)"/>
  <ellipse cx="800" cy="700" rx="520" ry="60" fill="#fc6e20" opacity="0.08"/>

  <!-- back card, offset, hints at "card not final" -->
  <rect x="488" y="246" width="720" height="454" rx="34" fill="none" stroke="#f3e7d8" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="10 12"/>

  <g filter="url(#shadow)">
    <rect x="440" y="190" width="720" height="454" rx="34" fill="url(#card)"/>
    <g clip-path="url(#cardClip)">
      <!-- concentric rings: an abstract mark, not a brand logo -->
      <g fill="none" stroke="#fc6e20" stroke-width="2">
        <circle cx="1060" cy="250" r="120" stroke-opacity="0.55"/>
        <circle cx="1060" cy="250" r="190" stroke-opacity="0.38"/>
        <circle cx="1060" cy="250" r="260" stroke-opacity="0.24"/>
        <circle cx="1060" cy="250" r="330" stroke-opacity="0.14"/>
        <circle cx="1060" cy="250" r="400" stroke-opacity="0.08"/>
      </g>
      <rect x="440" y="190" width="720" height="454" fill="url(#sheen)"/>
    </g>
    <rect x="440.5" y="190.5" width="719" height="453" rx="33.5" fill="none" stroke="#fff" stroke-opacity="0.14"/>

    <!-- chip -->
    <rect x="512" y="318" width="92" height="70" rx="12" fill="url(#chip)"/>
    <g stroke="#8a6a35" stroke-opacity="0.7" stroke-width="2" fill="none">
      <path d="M512 341h30M512 365h30M574 341h30M574 365h30"/>
      <rect x="542" y="330" width="32" height="46" rx="6"/>
    </g>
    <!-- contactless -->
    <g fill="none" stroke="#f3e7d8" stroke-opacity="0.75" stroke-width="5" stroke-linecap="round">
      <path d="M640 334a28 28 0 0 1 0 38"/>
      <path d="M656 322a46 46 0 0 1 0 62"/>
      <path d="M672 310a64 64 0 0 1 0 86"/>
    </g>

    <text x="512" y="270" fill="#f3e7d8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.5">Eternal SBI Card</text>
    <text x="512" y="560" fill="#f3e7d8" fill-opacity="0.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="3">ZOMATO · BLINKIT · DISTRICT</text>
    <text x="512" y="600" fill="#f3e7d8" fill-opacity="0.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" letter-spacing="1">Illustration · final design not yet published</text>
  </g>

  <!-- status tag -->
  <g transform="translate(1012 568)">
    <rect width="112" height="44" rx="22" fill="#fc6e20"/>
    <text x="56" y="29" text-anchor="middle" fill="#1a0d06" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1">SOON</text>
  </g>
</svg>
