<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151a"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="shadowBack" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="shadowFront" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="18" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="16.5" fill="none" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <g transform="rotate(-9 29 27)" filter="url(#shadowBack)">
    <rect x="13" y="15" width="36" height="23" rx="4" fill="url(#goldGrad)"/>
    <rect x="13" y="20" width="36" height="4.5" fill="#14151a" opacity="0.3"/>
  </g>

  <g filter="url(#shadowFront)">
    <rect x="14" y="24" width="36" height="23" rx="4" fill="url(#blueGrad)"/>
    <rect x="14" y="28.5" width="36" height="4.5" fill="#090a0f" opacity="0.85"/>
    <rect x="18.5" y="36.5" width="6" height="4.5" rx="1" fill="url(#goldGrad)"/>
    <circle cx="41.5" cy="38.5" r="2.8" fill="#ffffff" opacity="0.95"/>
    <circle cx="45" cy="38.5" r="2.8" fill="#fef08a" opacity="0.9"/>
  </g>
</svg>